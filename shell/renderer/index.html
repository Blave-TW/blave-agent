<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<title>Blave</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head><body>

<!-- ============ 連結畫面(獨立畫面,不是 modal) ============ -->
<div id="view-connect" class="app">
  <div class="cn">
    <div class="cn-bar" style="-webkit-app-region:drag"></div>
    <div class="cn-mid">
      <h4 data-i18n="cn.h"></h4>
      <div class="cn-card">
        <button class="cn-back" id="cn-back" type="button" hidden></button>
        <div class="cn-sec cn-blave">
          <!-- 說明是標題的副標、不是段落:兩個選項各少一次眼睛停留。 -->
          <p class="cn-head">
            <span class="cn-ttl" data-i18n="cn.blave.title"></span>
            <span class="cn-meta" data-i18n="cn.blave.desc"></span>
          </p>
          <button class="btn-fill" id="btn-blave" type="button"></button>
        </div>
        <div class="cn-sec">
          <p class="cn-head">
            <span class="cn-ttl" data-i18n="cn.local.label"></span>
            <span class="cn-meta" data-i18n="cn.local.desc"></span>
            <button class="btn-quiet" id="btn-redetect" type="button" data-i18n="cn.redetect"></button>
          </p>
          <!-- 兩列由 JS 畫(偵測中也是同樣兩列,只換狀態字),列數固定不 reflow -->
          <div class="cn-rows" id="agent-rows"></div>
          <p class="cn-hint" id="cn-hint" hidden></p>
        </div>
      </div>
      <p class="cn-foot" id="cn-foot" data-i18n="cn.foot"></p>
    </div>
  </div>
</div>

<!-- ============ 三欄工作頁(v1:全空) ============ -->
<div id="view-ws" class="app" hidden>
  <!-- 滿版 38px 拖曳條。原本 drag 只掛在側欄的字標上(236px),其餘一千多 px 的
       標題列帶拖不動;而且字標擠在紅綠燈那一帶,產品名被燈號蓋成「olave」。
       這條跟連結畫面的 .cn-bar 是同一個做法。 -->
  <div class="ws-bar"></div>
  <div class="ws">
    <aside class="pane-strategies">
      <div class="ws-brand"><svg class="wm" viewBox="0 0 588 180" aria-label="Blave" role="img"><g fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M0 0H20V68.7962C31.8393 57.2517 47.8079 50 65 50C99.9506 50 130 80 130 115C130 150 100 180 65 180C30 180 -5.27718e-05 150 0 115V0ZM64.9999 70C39.9999 70 19.9999 90 19.9999 115C19.9999 140 40.0001 160 65 160C89.9999 160 110 140.5 110 115C110 89.5 89.9999 70 64.9999 70Z"/><path d="M174 0H154V170C154 170 154 174 157 177C160 180 164 180 164 180H188V160H174V0Z"/><path fill-rule="evenodd" clip-rule="evenodd" d="M328 180H308V161.194C296.161 172.738 280.192 179.991 263 179.991C228.049 179.991 198 149.989 198 114.99C198 79.9912 228 50 263 50C298 50 328 79.9912 328 114.99V180ZM263 159.99C288 159.99 308 139.99 308 114.99C308 89.9909 288 69.9903 263 69.9903C238 69.9903 218 89.491 218 114.99C218 140.49 238 159.99 263 159.99Z"/><path d="M393 150L354.494 50H333L378 165.5L382 175.5C383.5 178 385 180 393 180C401 180 402.5 178 404 175.5L408 165.5L453 50H431.5L393 150Z"/><path fill-rule="evenodd" clip-rule="evenodd" d="M523 180C488.049 180 458 150 458 115C458 79.9998 488 49.9998 523 49.9998C558 49.9998 588 79.9998 588 115C587.2 122.761 581 125.069 578 125.253H566.845H479.12C483.659 145.546 501.476 160 523 160C539.672 160 554.12 151.106 561.896 137.766L578.848 147.5C567.329 166.713 546.264 180 523 180ZM523 69.9998C501.282 69.9998 483.337 84.7164 479 105.299H566.968C562.576 85.0203 544.665 69.9998 523 69.9998Z"/></g></svg></div>
      <div class="strat-head"><span class="label" data-i18n="ws.strategies"></span></div>
      <div class="strat-list"><p class="pf-state" data-i18n="ws.noStrategies"></p></div>
      <button class="ws-conn" id="ws-conn" type="button"></button>
    </aside>
    <section class="pane-main">
      <!-- 起手範例放在中欄(Wei):聊天欄只留一句話;中欄本來就空著,範例鈕在這裡
           同時交代了「這一欄之後會出現什麼」。點了直接送出。 -->
      <div class="main-empty" id="main-empty">
        <!-- 照雲端工作頁的 welcome(workspace.html `.main-welcome`):品牌記號當浮水印,
             只比背景亮一階、不加底板——留白就是頁面本身;下面是起手短籤。沒有說明句。 -->
        <div class="wc-inner">
          <svg class="wc-mark" viewBox="0 0 180 180" aria-hidden="true">
            <path d="M0 108.973 A90 90 0 0 1 76.668 108.182 A20 20 0 0 0 105 90 A45 45 0 0 1 180 56.459 L180 180 L0 180 Z" fill="currentColor" />
          </svg>
          <div class="wc-chips">
            <button class="wc-chip" id="chat-eg" type="button" data-i18n="ws.chatExample"></button>
          </div>
        </div>
      </div>
    </section>
    <section class="pane-chat">
      <div class="chat-scroll" id="chat-scroll">
        <!-- v1 三欄裡只有這一欄能用,所以由它開口;另外兩欄收回一行狀態句,
             不再各自叫用戶「去右邊跟 agent 講話」(同一個例子原本出現兩次)。 -->
        <div class="chat-empty" id="chat-empty">
          <p data-i18n="ws.chatEmpty"></p>
        </div>
      </div>
      <div class="chat-input-wrap">
        <!-- 輸入框:上 textarea、下工具列(左=model/effort 觸發鈕,右=送出)。
             選 model 放這裡而不是左下角:引擎是設一次的事(誰付錢、要不要重新授權),
             model / effort 是每個任務都可能換的,兩件事不擠同一個入口。 -->
        <div class="chat-input">
          <textarea id="ta" rows="1" data-i18n-ph="ws.placeholder"></textarea>
          <div class="ci-bar">
            <div class="mp" id="mp" hidden>
              <button class="mp-trigger" id="mp-trigger" type="button"
                      aria-haspopup="dialog" aria-expanded="false" aria-controls="mp-panel">
                <span class="mp-t-model" id="mp-t-model"></span>
                <span class="mp-t-effort" id="mp-t-effort"></span>
                <span class="mp-chev" aria-hidden="true"></span>
              </button>
              <div class="mp-panel" id="mp-panel" role="dialog" hidden>
                <p class="mp-cap" data-i18n="mp.model"></p>
                <div class="mp-models" id="mp-models" role="radiogroup"></div>
                <div class="mp-div" id="mp-div"></div>
                <!-- 「思考深度」本身是 tooltip 的觸發點(點線底線 = 滑過有解釋的慣例)。
                     說明句是在解釋術語 → tooltip(canon › Tooltip)。 -->
                <p class="mp-cap mp-cap-tip" id="mp-effort-cap">
                  <button class="mp-tip" id="mp-tip" type="button" aria-describedby="mp-tipbox" data-i18n="mp.effort"></button>
                  <span class="tip" id="mp-tipbox" role="tooltip"></span>
                </p>
                <div class="mp-rail" id="mp-rail" role="radiogroup"></div>
                <p class="mp-note" id="mp-note" aria-live="polite"></p>
              </div>
            </div>
            <button class="btn-send" id="btn-send" type="button" data-i18n-aria="ws.send">↑</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="strings.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body></html>
