<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<!-- CSP:這個畫面會渲染 LLM 產生的文字,而且能觸發「啟動雲端方案」(花錢)。程式只從本機檔案載,
     不准 inline script / eval / 任何外連;圖是主行程給的 data: URI;inline style 屬性有一處(拖曳區) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Blave</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="report-backtest.css">
<link rel="stylesheet" href="report-trades.css">
<link rel="stylesheet" href="trade.css">
</head><body>

<!-- ============ 連結畫面(獨立畫面,不是 modal) ============ -->
<div id="view-connect" class="app">
  <div class="cn">
    <div class="cn-bar" style="-webkit-app-region:drag"></div>
    <div class="cn-mid">
      <h4 data-i18n="cn.h"></h4>
      <div class="cn-card">
        <div class="cn-sec cn-blave">
          <!-- 說明是標題的副標、不是段落:兩個選項各少一次眼睛停留。 -->
          <p class="cn-head">
            <span class="cn-ttl" data-i18n="cn.blave.title"></span>
            <span class="cn-meta" data-i18n="cn.blave.desc"></span>
          </p>
          <span class="cn-cur" id="cn-blave-cur" hidden></span>
          <button class="btn-fill" id="btn-blave" type="button"></button>
          <!-- 有 token 才出現。登出=把這台電腦上的 token 刪掉(共用電腦、換帳號) -->
        </div>
        <div class="cn-sec">
          <p class="cn-head">
            <span class="cn-ttl" data-i18n="cn.local.label"></span>
            <span class="cn-meta" data-i18n="cn.local.desc"></span>
            <button class="btn-quiet" id="btn-redetect" type="button" data-i18n="cn.redetect"></button>
          </p>
          <!-- 兩列由 JS 畫(偵測中也是同樣兩列,只換狀態字),列數固定不 reflow -->
          <div class="cn-rows" id="agent-rows"></div>
          <p class="cn-hint" id="cn-hint" hidden></p>
        </div>
      </div>
      <!-- 尾註列:左邊「連結後可以隨時更換」、右邊介面語言 segment(設計師:視線只走這 560 一欄,
           角落是死區;尾註跟語言是同一種次要的話,同一列)。segment 由 JS 建(各語言自己的名字,
           不進 .po),設定 modal 的 select 是同一件事、兩邊同步。 -->
      <div class="cn-foot" id="cn-foot">
        <p data-i18n="cn.foot"></p>
        <div class="cn-lang" id="cn-lang" role="radiogroup" data-i18n-aria="set.lang"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 三欄工作頁(v1:全空) ============ -->
<div id="view-ws" class="app" hidden>
  <!-- 滿版 38px 拖曳條。原本 drag 只掛在側欄的字標上(236px),其餘一千多 px 的
       標題列帶拖不動;而且字標擠在紅綠燈那一帶,產品名被燈號蓋成「olave」。
       這條跟連結畫面的 .cn-bar 是同一個做法。 -->
  <div class="ws-bar"></div>
  <div class="ws">
    <aside class="pane-strategies">
      <!-- 自動下單入口:位置照雲端 #pf_nav(策略清單上方)。不放圖示——這個側欄的列本來就沒有圖示 -->
      <nav class="side-nav" id="side-nav"><button class="strat-row" id="tr-nav" type="button"><svg class="side-nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"/><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/></svg><span class="strat-name" data-i18n="tr.nav"></span><span class="mode" id="tr-nav-mode" hidden></span><i class="run-dot live" id="tr-nav-dot" aria-hidden="true" hidden></i></button></nav>
      <div class="strat-head" id="strat-head"><span class="label" data-i18n="ws.strategies"></span></div>
      <div class="strat-list" id="strat-list"><p class="pf-state" id="strat-empty" data-i18n="ws.noStrategies"></p></div>
      <!-- 雲端那幾份:第一刀只當清單看(單支策略的端點還沒做),名字是雲端來的字串,一律 textContent -->
      <div class="strat-list" id="strat-list-cloud" hidden></div>
      <div class="side-rail"><button class="rail-btn" id="rail-open" type="button" data-i18n-aria="ws.sideExpand"><svg class="ws-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><line x1="6" y1="2.75" x2="6" y2="13.25"/><polyline points="9.6,6.2 11.4,8 9.6,9.8"/></svg></button></div>
      <!-- 左下角:設定(照雲端 .ws-foot / .ws-more 的樣式;雲端是「更多」選單,
           桌面版只有設定一項,所以直接開 modal 不展開) -->
      <div class="ws-foot">
        <button class="ws-more" id="ws-conn" type="button" aria-haspopup="dialog">
          <svg class="ws-more-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span data-i18n="ws.settings"></span>
          <!-- 只在三種時候出字:試用最後 3 天 / 啟動中 / 已停機;其餘時間空的(不做徽章、不加紅點) -->
          <span class="ws-more-note" id="ws-conn-note" hidden></span>
        </button>
      </div>
    </aside>
    <div class="pane-div" id="div-side" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria="ws.resizeSide"><button class="handle" type="button" tabindex="-1" data-i18n-aria="ws.sideCollapse"><svg class="ws-icon" viewBox="0 0 16 16" aria-hidden="true"><polyline points="9.8,3.6 5.4,8 9.8,12.4"/></svg></button></div>
    <section class="pane-main">
      <!-- 中欄上方本來就在的 44px 拖曳區:最左是「這台電腦｜雲端」切換器(整個 workspace 跟著換),右邊一句這一邊的狀態。
           兩格永遠可按;格內的錢記號與狀態由 trade.js 畫。整條仍可拖視窗,只有切換器 no-drag -->
      <div class="tb" id="tr-tb">
        <div class="envsw" id="envsw" role="group" data-i18n-aria="env.aria"><button type="button" id="env-local" data-env="local" aria-pressed="true"></button><button type="button" id="env-cloud" data-env="cloud" aria-pressed="false"></button></div>
        <span class="mode" id="tr-tb-mode" hidden></span><span class="tb-txt" id="tr-tb-txt"></span>
      </div>
      <!-- 自動下單頁:骨架照雲端工作頁(標題列 + 五分頁),內容由 trade.js 畫,一律 DOM 節點 + textContent -->
      <div class="trv" id="tr" hidden>
        <div class="main-head">
          <div class="txt">
            <h5 class="main-head-name" id="tr-h" tabindex="-1" data-i18n="tr.nav"></h5>
            <div class="main-head-desc" id="tr-desc"></div>
            <!-- 雲端第一刀唯讀:全頁唯一的說明(不能按的鈕用 aria-describedby 指到這裡) -->
            <p class="tr-ro-note" id="tr-ro-note" hidden></p>
            <!-- 主機停機:講的是整頁的事,放在標題描述下、分頁列上(停機時上面那行說明本來就不出) -->
            <div id="tr-verdict" hidden></div>
            <p class="pf-alert" id="tr-alert" hidden></p>
          </div>
          <div class="act" id="tr-act"></div>
        </div>
        <div class="main-tabs" role="tablist" id="tr-tabs" data-i18n-aria="tr.nav" hidden>
          <button class="main-tab" type="button" role="tab" id="tr-tab-over" data-tab="over" aria-controls="tr-over" data-i18n="tr.tab.over"></button>
          <button class="main-tab" type="button" role="tab" id="tr-tab-pos" data-tab="pos" aria-controls="tr-pos" data-i18n="tr.tab.pos"></button>
          <button class="main-tab" type="button" role="tab" id="tr-tab-assets" data-tab="assets" aria-controls="tr-assets" data-i18n="tr.tab.assets"></button>
          <button class="main-tab" type="button" role="tab" id="tr-tab-hist" data-tab="hist" aria-controls="tr-hist" data-i18n="tr.tab.hist"></button>
          <button class="main-tab" type="button" role="tab" id="tr-tab-set" data-tab="set" aria-controls="tr-set" data-i18n="tr.tab.set"></button>
        </div>
        <div class="pf" id="tr-onboard" hidden></div>
        <div class="pf" id="tr-over" role="tabpanel" aria-labelledby="tr-tab-over" tabindex="0" hidden></div>
        <div class="pf" id="tr-pos" role="tabpanel" aria-labelledby="tr-tab-pos" tabindex="0" hidden></div>
        <div class="pf" id="tr-assets" role="tabpanel" aria-labelledby="tr-tab-assets" tabindex="0" hidden></div>
        <div class="pf" id="tr-hist" role="tabpanel" aria-labelledby="tr-tab-hist" tabindex="0" hidden></div>
        <div class="pf" id="tr-set" role="tabpanel" aria-labelledby="tr-tab-set" tabindex="0" hidden></div>
      </div>
      <!-- 雲端視角、沒有主機可看(沒主機 / 未登入 / 啟動中 / 讀不到):內容由 trade.js 畫 -->
      <div class="trv" id="cv-empty" hidden>
        <div class="main-head"><div class="txt"><h5 class="main-head-name" id="cv-h" tabindex="-1" data-i18n="env.empty.title"></h5><div class="main-head-desc" id="cv-desc"></div></div></div>
        <div class="pf" id="cv-body"></div>
      </div>
      <!-- 策略報告(選了策略才出現;沒選時是下面的 welcome)。三個分頁:回測 / 進出場 /
           程式碼。回測與進出場各自一支檔(report-backtest.js / report-trades.js),
           介面是 window.BlaveReport.renderBacktest(el, stats) / renderTrades(el, stats)。 -->
      <div class="rp" id="rp" hidden>
        <!-- 精簡標題(同雲端):給人看的名字 + 一句說明 -->
        <div class="rp-head">
          <h5 class="rp-name" id="rp-name"></h5>
          <p class="rp-desc" id="rp-desc"></p>
        </div>
        <div class="rp-tabs" role="tablist" id="rp-tabs">
          <button class="rp-tab" type="button" role="tab" data-tab="bt" data-i18n="rp.tab.backtest"></button>
          <button class="rp-tab" type="button" role="tab" data-tab="tr" data-i18n="rp.tab.trades"></button>
          <button class="rp-tab" type="button" role="tab" data-tab="code" data-i18n="rp.tab.code"></button>
        </div>
        <div class="rp-panel" id="rp-bt" role="tabpanel"></div>
        <div class="rp-panel" id="rp-tr" role="tabpanel" hidden></div>
        <div class="rp-panel" id="rp-code" role="tabpanel" hidden><pre class="rp-code mono" id="rp-code-pre"></pre></div>
      </div>
      <!-- 起手範例放在中欄(Wei):聊天欄只留一句話;中欄本來就空著,範例鈕在這裡
           同時交代了「這一欄之後會出現什麼」。點了直接送出。 -->
      <div class="main-empty" id="main-empty">
        <!-- 照雲端工作頁的 welcome(workspace.html `.main-welcome`):品牌記號當浮水印,
             只比背景亮一階、不加底板——留白就是頁面本身;下面是起手短籤。沒有說明句。 -->
        <div class="wc-inner">
          <svg class="wc-mark" viewBox="0 0 180 180" aria-hidden="true">
            <path d="M0 108.973 A90 90 0 0 1 76.668 108.182 A20 20 0 0 0 105 90 A45 45 0 0 1 180 56.459 L180 180 L0 180 Z" fill="currentColor" />
          </svg>
          <div class="wc-chips">
            <button class="wc-chip" id="chat-eg" type="button" data-i18n="ws.chatExample"></button>
          </div>
        </div>
      </div>
    </section>
    <div class="pane-div" id="div-chat" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria="ws.resizeChat"><button class="handle" type="button" tabindex="-1" data-i18n-aria="ws.chatCollapse"><svg class="ws-icon" viewBox="0 0 16 16" aria-hidden="true"><polyline points="6.2,3.6 10.6,8 6.2,12.4"/></svg></button></div>
    <button class="chat-strip" id="chat-strip" type="button" data-i18n-aria="ws.chatExpand"><svg class="ws-icon" viewBox="0 0 16 16" aria-hidden="true"><polyline points="9.8,3.6 5.4,8 9.8,12.4"/></svg></button>
    <section class="pane-chat">
      <!-- 對話列(照雲端 .chat-head):清單鈕 → 目前對話標題 → 新對話。標題是用戶打的字,
           一律 textContent。回合進行中兩顆鈕都鎖住——第一版一次只跑一條對話。 -->
      <div class="chat-head" id="cs-head">
        <button class="cs-btn" id="cs-toggle" type="button" aria-controls="cs-list" aria-expanded="false" data-i18n-aria="cs.all">
          <svg class="ic cs-ico-list" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h.01M3 18h.01M3 6h.01M8 12h13M8 18h13M8 6h13"/></svg>
          <svg class="ic cs-ico-back" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="cs-title" id="cs-title"></span>
        <button class="cs-btn cs-new" id="cs-new" type="button" data-i18n-aria="cs.new">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
        </button>
      </div>
      <!-- 清單層蓋在聊天本體上、不替換它:捲動位置與打到一半的字原封不動 -->
      <div class="chat-body">
      <div class="chat-list" id="cs-list" role="region" data-i18n-aria="cs.all" hidden>
        <button class="cs-newrow" id="cs-newrow" type="button">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>
          <span data-i18n="cs.new"></span>
        </button>
        <div class="cs-rows" id="cs-rows"></div>
      </div>
      <div class="chat-scroll" id="chat-scroll">
      </div>
      <div class="chat-input-wrap">
        <!-- 輸入框:上 textarea、下工具列(左=model/effort 觸發鈕,右=送出)。
             選 model 放這裡而不是左下角:引擎是設一次的事(誰付錢、要不要重新授權),
             model / effort 是每個任務都可能換的,兩件事不擠同一個入口。 -->
        <!-- 只在雲端視角顯示(第一刀):整窗是灰的雲端,但 agent 這一版只操作這台電腦,不講會被誤會 -->
        <div class="chat-tgt" id="chat-tgt" hidden><p><span data-i18n="chat.tgt.label"></span> <b data-i18n="env.local"></b></p><p data-i18n="chat.tgt.cut1"></p></div>
        <div class="chat-input">
          <textarea id="ta" rows="1" data-i18n-ph="ws.placeholder"></textarea>
          <div class="ci-bar">
            <div class="mp" id="mp" hidden>
              <button class="mp-trigger" id="mp-trigger" type="button"
                      aria-haspopup="dialog" aria-expanded="false" aria-controls="mp-panel">
                <span class="mp-t-model" id="mp-t-model"></span>
                <span class="mp-t-effort" id="mp-t-effort"></span>
                <span class="mp-chev" aria-hidden="true"></span>
              </button>
              <div class="mp-panel" id="mp-panel" role="dialog" hidden>
                <p class="mp-cap" data-i18n="mp.model"></p>
                <div class="mp-models" id="mp-models" role="radiogroup"></div>
                <div class="mp-div" id="mp-div"></div>
                <!-- 「思考深度」本身是 tooltip 的觸發點(點線底線 = 滑過有解釋的慣例)。
                     說明句是在解釋術語 → tooltip(canon › Tooltip)。 -->
                <p class="mp-cap mp-cap-tip" id="mp-effort-cap">
                  <button class="mp-tip" id="mp-tip" type="button" aria-describedby="mp-tipbox" data-i18n="mp.effort"></button>
                  <span class="tip" id="mp-tipbox" role="tooltip"></span>
                </p>
                <div class="mp-rail" id="mp-rail" role="radiogroup"></div>
                <p class="mp-note" id="mp-note" aria-live="polite"></p>
              </div>
            </div>
            <button class="btn-send" id="btn-send" type="button" data-i18n-aria="ws.send">↑</button>
          </div>
        </div>
      </div>
      </div>
    </section>
  </div>
</div>

<!-- ============ 設定 modal(樣式照雲端 .scrim / .ns-modal.set-modal) ============
     兩個分類:顯示(語言)、模型接入(換 agent——內容就是連結畫面那張卡,開的時候
     把 .cn-card 整個搬進來,同一份 DOM 與邏輯,不養第二份)。 -->
<div class="scrim" id="set-scrim" role="dialog" aria-modal="true" aria-labelledby="set-title" hidden>
  <div class="set-modal" id="set-modal">
    <div class="modal-head">
      <h6 id="set-title" data-i18n="ws.settings"></h6>
      <button type="button" class="modal-close" id="set-close" data-i18n-aria="set.close">✕</button>
    </div>
    <div class="set-body">
      <nav class="set-cats" id="set-cats" data-i18n-aria="set.cats">
        <button type="button" class="set-cat" data-set-cat="display" aria-current="true" data-i18n="set.cat.display"></button>
        <button type="button" class="set-cat" data-set-cat="model" data-i18n="set.cat.model"></button>
        <!-- 會花錢的一類排最後:前兩類是偏好。聊天裡的情境卡會直接開到這裡 -->
        <button type="button" class="set-cat" data-set-cat="plan" data-i18n="set.cat.plan"></button>
        <!-- 帳號區:登入是帳號的事,不是某一種 AI 的事。兩態都顯示(已登入 / 未登入),字與鈕由 app.js 的 acctPaintAcct 畫。
             那顆鈕吃 .set-cat 的樣子但不是分類(沒有 data-set-cat、不給 aria-current) -->
        <div class="set-acct" id="set-acct">
          <div class="who"><p class="l1" id="set-acct-who"></p><p class="l2" id="set-acct-st"></p></div>
          <button type="button" class="set-cat" id="set-acct-btn"></button>
        </div>
      </nav>
      <div class="set-content">
        <div class="set-pane" data-set-cat="display">
          <div class="set-row">
            <label class="set-gl" for="set-lang" data-i18n="set.lang"></label>
            <span class="set-selw">
              <!-- option 由 app.js 建(原生語名,不進 .po) -->
              <select class="set-sel" id="set-lang"></select>
            </span>
          </div>
          <!-- 關於(這一頁最下面):版號、更新狀態、右邊一顆鈕。字與鈕由 app.js 的 upPaint 依狀態畫 -->
          <div class="set-about" id="set-up">
            <div class="t"><p class="ver mono" id="set-up-ver"></p><p class="st" id="set-up-txt" role="status"></p></div>
            <button type="button" class="btn-quiet" id="set-up-btn" hidden></button>
          </div>
        </div>
        <div class="set-pane" data-set-cat="model" id="set-model" hidden></div>
        <!-- 雲端方案:內容由 app.js 的 planPaint 畫(依 account_status.plan)。上半自己捲,
             底列(「存在就扣」那句 + 鈕)不捲——那句話永遠貼在鈕的正上方 -->
        <div class="set-pane plan-pane" data-set-cat="plan" id="set-plan" hidden></div>
      </div>
    </div>
  </div>
</div>

<!-- 讀屏播報:常駐的 polite live region(見 app.js srSay) -->
<div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<!-- 圖片放大 -->
<div class="scrim lb-scrim" id="lb-scrim" role="dialog" aria-modal="true" data-i18n-aria="chat.imageZoom" hidden>
  <button type="button" class="modal-close lb-close" id="lb-close" data-i18n-aria="set.close">✕</button>
  <img class="lb-img" id="lb-img" alt="">
</div>

<!-- 連接交易所(自動下單頁的「連接交易所」直接開這個框;結構照雲端版)。內容由 trade.js 的 cxModalPaint 畫。
     只在「這台電腦」視角開得起來——雲端第一刀唯讀,trade.js 的 cxModalOpen 硬擋 -->
<div class="scrim" id="cx-scrim" role="dialog" aria-modal="true" aria-labelledby="cx-title" hidden>
  <div class="set-modal cx-modal" id="cx-modal">
    <div class="modal-head">
      <h6 id="cx-title" data-i18n="cx.connect"></h6>
      <button type="button" class="modal-close" id="cx-close" data-i18n-aria="set.close">✕</button>
    </div>
    <div class="cx-body" id="cx-body"></div>
    <div class="modal-foot">
      <button type="button" class="btn-out" id="cx-cancel" data-i18n="del.cancel"></button>
      <button type="button" class="btn-fill" id="cx-go"></button>
    </div>
  </div>
</div>

<!-- 刪對話的確認框(外框沿用 .scrim / .set-modal;寬 440 = 雲端 .ns-modal) -->
<div class="scrim" id="del-scrim" role="dialog" aria-modal="true" aria-labelledby="del-title" aria-describedby="del-body" hidden>
  <div class="set-modal del-modal" id="del-modal">
    <div class="modal-head">
      <span class="mode paper" id="del-mark" hidden></span>
      <h6 id="del-title"></h6>
      <button type="button" class="modal-close" id="del-close" data-i18n-aria="set.close">✕</button>
    </div>
    <!-- div 不是 p:啟動方案的確認要放三段 <p>(刪對話只有一句,直接寫字) -->
    <div class="del-body" id="del-body"></div>
    <div class="modal-foot">
      <button type="button" class="btn-out" id="del-cancel" data-i18n="del.cancel"></button>
      <button type="button" class="btn-out" id="del-alt" hidden></button>
      <button type="button" class="btn-fill" id="del-ok" data-i18n="del.ok"></button>
    </div>
  </div>
</div>

<script src="../node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<script src="i18n.js"></script>
<script src="report-backtest.js"></script>
<script src="report-trades.js"></script>
<script src="trade.js"></script>
<script src="app.js"></script>
</body></html>
