<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head><meta charset="utf-8">
<title>Blave</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="app.css">
</head><body>

<!-- ============ 連結畫面(獨立畫面,不是 modal) ============ -->
<div id="view-connect" class="app">
  <div class="cn">
    <div class="cn-bar" style="-webkit-app-region:drag"></div>
    <div class="cn-mid">
      <div class="cn-brand"><svg class="wm" viewBox="0 0 588 180" aria-label="Blave" role="img"><g fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M0 0H20V68.7962C31.8393 57.2517 47.8079 50 65 50C99.9506 50 130 80 130 115C130 150 100 180 65 180C30 180 -5.27718e-05 150 0 115V0ZM64.9999 70C39.9999 70 19.9999 90 19.9999 115C19.9999 140 40.0001 160 65 160C89.9999 160 110 140.5 110 115C110 89.5 89.9999 70 64.9999 70Z"/><path d="M174 0H154V170C154 170 154 174 157 177C160 180 164 180 164 180H188V160H174V0Z"/><path fill-rule="evenodd" clip-rule="evenodd" d="M328 180H308V161.194C296.161 172.738 280.192 179.991 263 179.991C228.049 179.991 198 149.989 198 114.99C198 79.9912 228 50 263 50C298 50 328 79.9912 328 114.99V180ZM263 159.99C288 159.99 308 139.99 308 114.99C308 89.9909 288 69.9903 263 69.9903C238 69.9903 218 89.491 218 114.99C218 140.49 238 159.99 263 159.99Z"/><path d="M393 150L354.494 50H333L378 165.5L382 175.5C383.5 178 385 180 393 180C401 180 402.5 178 404 175.5L408 165.5L453 50H431.5L393 150Z"/><path fill-rule="evenodd" clip-rule="evenodd" d="M523 180C488.049 180 458 150 458 115C458 79.9998 488 49.9998 523 49.9998C558 49.9998 588 79.9998 588 115C587.2 122.761 581 125.069 578 125.253H566.845H479.12C483.659 145.546 501.476 160 523 160C539.672 160 554.12 151.106 561.896 137.766L578.848 147.5C567.329 166.713 546.264 180 523 180ZM523 69.9998C501.282 69.9998 483.337 84.7164 479 105.299H566.968C562.576 85.0203 544.665 69.9998 523 69.9998Z"/></g></svg></div>
      <p class="cn-sub">Blave 不內建 AI。選一個來寫策略、跑回測。</p>
      <div class="cn-card">
        <div class="cn-sec cn-blave">
          <div class="t">
            <div class="cn-ttl">用 Blave 的 AI</div>
            <p class="cn-desc">登入 Blave 帳號即可開始，按用量計費，不需要自己的 AI 訂閱。</p>
          </div>
          <button class="btn-fill" id="btn-blave" type="button">登入 Blave</button>
        </div>
        <div class="cn-sec">
          <div class="cn-head">
            <span class="l">本機 agent</span>
            <button class="btn-quiet" id="btn-redetect" type="button">重新偵測</button>
          </div>
          <p class="cn-desc">用自己的 Claude Code 或 Codex 訂閱，Blave 不收 AI 費用。</p>
          <div class="cn-rows" id="agent-rows">
            <p class="cn-desc" id="detecting">偵測中…</p>
          </div>
          <p class="cn-hint" id="cn-hint" hidden></p>
        </div>
      </div>
      <p class="cn-foot">連結後可以隨時更換。</p>
    </div>
  </div>
</div>

<!-- ============ 三欄工作頁(v1:全空) ============ -->
<div id="view-ws" class="app" hidden>
  <div class="ws">
    <aside class="pane-strategies">
      <div class="ws-brand" style="-webkit-app-region:drag"><svg class="wm" viewBox="0 0 588 180" aria-label="Blave" role="img"><g fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M0 0H20V68.7962C31.8393 57.2517 47.8079 50 65 50C99.9506 50 130 80 130 115C130 150 100 180 65 180C30 180 -5.27718e-05 150 0 115V0ZM64.9999 70C39.9999 70 19.9999 90 19.9999 115C19.9999 140 40.0001 160 65 160C89.9999 160 110 140.5 110 115C110 89.5 89.9999 70 64.9999 70Z"/><path d="M174 0H154V170C154 170 154 174 157 177C160 180 164 180 164 180H188V160H174V0Z"/><path fill-rule="evenodd" clip-rule="evenodd" d="M328 180H308V161.194C296.161 172.738 280.192 179.991 263 179.991C228.049 179.991 198 149.989 198 114.99C198 79.9912 228 50 263 50C298 50 328 79.9912 328 114.99V180ZM263 159.99C288 159.99 308 139.99 308 114.99C308 89.9909 288 69.9903 263 69.9903C238 69.9903 218 89.491 218 114.99C218 140.49 238 159.99 263 159.99Z"/><path d="M393 150L354.494 50H333L378 165.5L382 175.5C383.5 178 385 180 393 180C401 180 402.5 178 404 175.5L408 165.5L453 50H431.5L393 150Z"/><path fill-rule="evenodd" clip-rule="evenodd" d="M523 180C488.049 180 458 150 458 115C458 79.9998 488 49.9998 523 49.9998C558 49.9998 588 79.9998 588 115C587.2 122.761 581 125.069 578 125.253H566.845H479.12C483.659 145.546 501.476 160 523 160C539.672 160 554.12 151.106 561.896 137.766L578.848 147.5C567.329 166.713 546.264 180 523 180ZM523 69.9998C501.282 69.9998 483.337 84.7164 479 105.299H566.968C562.576 85.0203 544.665 69.9998 523 69.9998Z"/></g></svg></div>
      <div class="strat-head"><span class="label">策略</span></div>
      <div class="strat-list"><p class="pf-state">還沒有策略。<br>跟右邊的 agent 說一個想法，回測完會出現在這裡。</p></div>
      <div class="ws-conn" id="ws-conn"></div>
    </aside>
    <section class="pane-main">
      <div class="main-empty">
        <p class="pf-state">還沒有東西可以看。<br>先在右邊跟 agent 講一句話，例如:回測一支 BTC 20/50 均線策略。</p>
      </div>
    </section>
    <section class="pane-chat">
      <div class="chat-scroll" id="chat-scroll"></div>
      <div class="chat-input-wrap">
        <div class="chat-input">
          <textarea id="ta" rows="1" placeholder="例如：回測一支 BTC 20/50 均線策略"></textarea>
          <button class="btn-send" id="btn-send" type="button" aria-label="送出">↑</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="app.js"></script>
</body></html>
